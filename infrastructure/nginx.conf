events {
    worker_connections 1024;
}

http {
    upstream discovery_backend {
        server discovery-service:8001;
    }

    upstream optimization_backend {
        server optimization-service:8002;
    }

    upstream validation_backend {
        server validation-service:8003;
    }

    upstream deployment_backend {
        server deployment-service:8004;
    }

    upstream orchestration_backend {
        server orchestration-service:8005;
    }

    upstream execution_backend {
        server execution-service:8006;
    }

    server {
        listen 8000;
        server_name api-gateway;

        # Discovery Service Routes
        location /api/v1/discovery/ {
            proxy_pass http://discovery_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Optimization Service Routes
        location /api/v1/optimization/ {
            proxy_pass http://optimization_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Validation Service Routes
        location /api/v1/validation/ {
            proxy_pass http://validation_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Deployment Service Routes
        location /api/v1/deployment/ {
            proxy_pass http://deployment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Orchestration Service Routes
        location /api/v1/orchestration/ {
            proxy_pass http://orchestration_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Execution Service Routes
        location /api/v1/execution/ {
            proxy_pass http://execution_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Root endpoint
        location / {
            return 200 '{"status": "StrategyOps API Gateway v2.0.0 - All 6 Services Active"}\n';
            add_header Content-Type application/json;
        }
    }
}
