[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Output directories - all test artifacts go to test-output/
addopts = --tb=short --strict-markers -q --cov=src --cov-report=html:test-output/coverage/html --cov-report=term-missing --html=test-output/reports/index.html --self-contained-html --junit-xml=test-output/reports/junit.xml
timeout = 300

markers =
    live: requires MT5 terminal or live data
    integration: integration test (requires services)
    e2e: end-to-end test (complete workflow)
    performance: performance test (benchmark)
    unit: unit test (no I/O, fast)
    slow: slow test (deselect with -m "not slow")
    database: requires database connection
    async: async test

junit_family = xunit2

# Coverage options
[coverage:run]
branch = True
omit =
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
