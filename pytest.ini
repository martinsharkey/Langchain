[pytest]
# The test harness lives in tests/. Files under examples/ are runnable demos, not
# unit tests, and one of them imports the legacy multi-agent orchestrator whose
# transitive langchain_core -> transformers -> torch import segfaults on hosts
# with a broken torch/c10.dll. Scoping collection to tests/ keeps the harness
# clean and reliable. (This does NOT skip any real test.)
testpaths = tests
asyncio_mode = auto
