[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --strict-markers -q
timeout = 300
markers =
    live: requires MT5 terminal or live data
    integration: end-to-end integration test
    slow: slow test, deselect with -m "not slow"
    unit: pure logic, no I/O
