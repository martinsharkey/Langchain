[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "strategyops"
version = "2.0.0"
description = "StrategyOps: Algorithmic Trading Strategy Discovery, Optimization, and Deployment Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "StrategyOps Team", email = "team@strategyops.ai"}
]
keywords = [
    "trading",
    "algorithmic",
    "strategy",
    "optimization",
    "backtesting",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment"
]

[project.urls]
Homepage = "https://github.com/example/strategyops"
Documentation = "https://docs.strategyops.ai"
Repository = "https://github.com/example/strategyops.git"
Issues = "https://github.com/example/strategyops/issues"

# ============================================================================
# Black Configuration
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | archive
)/
'''

# ============================================================================
# Isort Configuration
# ============================================================================
[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip = [".git", ".venv", "venv", "archive"]
skip_glob = ["**/migrations/**"]

# ============================================================================
# MyPy Configuration
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
show_error_context = true
no_error_summary = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.integrations.*"
ignore_missing_imports = true

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-ra",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80"
]
timeout = 300
markers = [
    "unit: Unit test",
    "integration: Integration test",
    "e2e: End-to-end test",
    "performance: Performance test",
    "live: Requires live data",
    "database: Requires database",
    "async: Async test",
    "slow: Slow test"
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if 0:",
    "if False:",
    "@abstractmethod",
    "@abc.abstractmethod"
]
precision = 2
show_missing = true

# ============================================================================
# Pylint Configuration
# ============================================================================
[tool.pylint.messages_control]
disable = [
    "C0111",  # Missing module docstring
    "R0913",  # Too many arguments
    "W0212",  # Protected access
    "C0103",  # Invalid name
    "W0401",  # Wildcard import
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 10
max-locals = 15
max-arguments = 5

# ============================================================================
# Bandit Configuration (Security)
# ============================================================================
[tool.bandit]
exclude_dirs = [".venv", "venv", "env", "archive", "tests"]
skips = ["B101"]  # Skip assert_used in tests
