apiVersion: v1
kind: Namespace
metadata:
  name: strategyops
  labels:
    name: strategyops

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: strategyops-config
  namespace: strategyops
data:
  LOG_LEVEL: "INFO"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "strategyops"

---
apiVersion: v1
kind: Secret
metadata:
  name: strategyops-secrets
  namespace: strategyops
type: Opaque
stringData:
  DATABASE_PASSWORD: "secure_password_change_me"
  JWT_SECRET_KEY: "your-secret-key-change-in-production"
  POSTGRES_PASSWORD: "secure_password_change_me"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: strategyops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "strategyops"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: strategyops-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "strategyops"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: postgres-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: strategyops
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: strategyops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
      - name: discovery-service
        image: strategyops-discovery:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: strategyops-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          value: "postgresql://strategyops:$(DB_PASSWORD)@postgres:5432/strategyops"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: strategyops-secrets
              key: DATABASE_PASSWORD
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: strategyops
spec:
  selector:
    app: discovery-service
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
    name: http
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimization-service
  namespace: strategyops
spec:
  replicas: 2
  selector:
    matchLabels:
