---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: strategyops-ingress
  namespace: strategyops
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: strategyops.local
    http:
      paths:
      - path: /api/v1/discovery
        pathType: Prefix
        backend:
          service:
            name: discovery-service
            port:
              number: 8001
      - path: /api/v1/optimization
        pathType: Prefix
        backend:
          service:
            name: optimization-service
            port:
              number: 8002
      - path: /api/v1/validation
        pathType: Prefix
        backend:
          service:
            name: validation-service
            port:
              number: 8003
      - path: /api/v1/deployment
        pathType: Prefix
        backend:
          service:
            name: deployment-service
            port:
              number: 8004
      - path: /api/v1/orchestration
        pathType: Prefix
        backend:
          service:
            name: orchestration-service
            port:
              number: 8005
      - path: /api/v1/execution
        pathType: Prefix
        backend:
          service:
            name: execution-service
            port:
              number: 8006
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8007
