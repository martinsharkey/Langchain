name: CI

# Runs the isolated test suite. `tests/conftest.py` redirects all cached `DATA_DIR`
# paths to a temp copy by default, so this job never mutates live proven-state files.
# Secrets are injected from GitHub Actions Secrets (never committed) — see SECURITY.md.
# Live MT5 is NOT exercised in CI; tests are offline/deterministic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: "Run live restart tests (requires Windows runner with MT5)"
        required: true
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Secrets come from repo Settings -> Secrets and variables -> Actions.
      # Absent secrets resolve to empty strings; the offline suite does not need them.
      MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      USE_KILO_GATEWAY: "true"
      TRADING_MODE: OBSERVE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Core test deps; MetaTrader5 is Windows-only and not needed for the
          # offline suite (imports are guarded), so it is intentionally omitted.
          pip install pytest pytest-cov pandas numpy scikit-learn || true
          pip install -r requirements.txt || true

      - name: Run isolated test suite with coverage
        run: pytest tests/ -q --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live-test:
    # Live restart tests require a Windows runner with MT5 terminal installed.
    # Enable manually from the Actions tab when a Windows runner is available.
    if: ${{ github.event.inputs.run_live_tests == 'true' }}
    runs-on: windows-latest
    env:
      MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      RUN_LIVE_RESTART: "1"
      TRADING_MODE: LIVE_MICRO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psutil pywin32 || true
          pip install -r requirements.txt || true

      - name: Run live restart tests
        run: pytest tests/test_bot_restart.py -m live -q
